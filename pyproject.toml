[project]
name = "langgraph-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atul Kumar Agrahari", email = "atul.01.login@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "langsmith>=0.14.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langgraph-agentic = "langgraph_agentic:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
